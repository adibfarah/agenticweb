name: Connector request
description: Ask for a new connector (booking system, shop platform, payment provider, CRM…)
labels: [connector]
body:
  - type: input
    id: system
    attributes:
      label: Which system?
      placeholder: "Square Appointments, BigCommerce, Mindbody, OpenTable…"
    validations:
      required: true
  - type: textarea
    id: actions
    attributes:
      label: Which actions should agents get?
      placeholder: "check availability, create booking, cancel booking…"
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Link to the system's API docs
