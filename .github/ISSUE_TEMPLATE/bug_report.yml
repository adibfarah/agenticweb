name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: CLI output
      description: Paste the output of the command (remove any secrets).
      render: text
  - type: input
    id: version
    attributes:
      label: Versions
      placeholder: "agenticweb 0.1.0, Node 24, Windows 11"
  - type: input
    id: site
    attributes:
      label: Site type
      placeholder: "Shopify store, WordPress blog, static site…"
