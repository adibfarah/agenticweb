# Checks a release before it's published to npm by hand.
# Runs when a GitHub release is published, or by hand ("Run workflow"): tests, typecheck, build, smoke test,
# checks the release tag matches the package version, and does an `npm publish --dry-run`.
# Publishing itself is done by the maintainer with 2FA, so npm shows the maintainer as the publisher.
name: Release check

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the package
        run: npm run build
      - name: Smoke test the built CLI
        run: node packages/cli/dist/agenticweb.mjs --help
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Release tag $TAG doesn't match packages/cli/package.json version $VERSION." >&2
            exit 1
          fi
      - name: Check what npm would publish
        run: npm publish -w packages/cli --access public --dry-run
